<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<meta name="description" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DISENYO LANG ANG NANDITO. Ang laman ay nasa content.js.
   Ang mga kulay sa :root ay pinapalitan ng theme{} sa content.js.
   ============================================================ */
:root{
  --bg:#0E1012; --surface:#16191C; --line:#2A3036;
  --text:#E9ECE8; --muted:#89929A;
  --accent:#C9F24D; --flag:#E8A33D; --sync:#C9F24D;
  --w:1140px; --gap:clamp(64px,8vw,124px);
  --sans:"Space Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{width:100%;max-width:var(--w);margin:0 auto;padding:0 24px}
img{max-width:100%;display:block}

h1,h2,h3,h4{font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:0}
h2{font-size:clamp(32px,4.6vw,56px)}
h3{font-size:clamp(21px,2.3vw,27px);line-height:1.2}
h4{font-size:18px;letter-spacing:-.01em}
p{margin:0 0 1em}
a{color:inherit}

.label{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.04em;margin:0 0 20px}
.label::before{content:"// "}
.lede{font-size:clamp(17px,1.8vw,20px);color:var(--muted);max-width:62ch}
section{padding:var(--gap) 0;border-top:1px solid var(--line)}
#top{border-top:0;padding-top:0}

/* header */
.masthead{position:sticky;top:0;z-index:30;background:rgba(14,16,18,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.masthead .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:64px}
.mark{font-family:var(--mono);font-size:14px;text-decoration:none;letter-spacing:-.02em}
.masthead nav{display:flex;gap:24px}
.masthead nav a{font-family:var(--mono);font-size:13px;color:var(--muted);text-decoration:none}
.masthead nav a::before{content:"// "}
.masthead nav a:hover{color:var(--accent)}
@media(max-width:820px){.masthead nav{display:none}}

/* hero */
.hero{padding-top:clamp(56px,8vw,104px);padding-bottom:0}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(30px,5vw,68px);align-items:center}
@media(max-width:920px){.hero-grid{grid-template-columns:1fr;gap:40px}}
.hero h1{font-size:clamp(46px,6.6vw,90px);margin-bottom:10px}
.hero .role{font-family:var(--mono);font-size:clamp(13px,1.5vw,17px);color:var(--muted);margin-bottom:30px}
.hero .lede{margin-bottom:34px}
.btnrow{display:flex;flex-wrap:wrap;gap:14px}

.btn{display:inline-block;font-family:var(--mono);font-size:14px;text-decoration:none;padding:15px 26px;border:1px solid var(--accent);color:var(--bg);background:var(--accent);transition:background .18s ease,color .18s ease}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* portrait */
/* Walang border dito: nasa .portrait-frame siya, na nasa HARAP ng litrato --
   iyon ang nagpaparamdam na bintana ang kahon at hindi patag na larawan. */
.portrait{position:relative;margin:0;background:var(--surface);overflow:hidden}
.portrait img{width:100%;height:auto;filter:saturate(.9) contrast(1.04)}
.portrait::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(14,16,18,0) 48%,rgba(14,16,18,.9) 100%)}
.portrait figcaption{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;gap:14px;padding:16px 18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.portrait figcaption b{color:var(--accent);font-weight:500}
@media(max-width:920px){.portrait-3d{max-width:420px}}

/* portrait — scroll-driven frame sequence.
   Ang <img> ay laging nasa markup, kaya ang bisitang walang JS, walang frames,
   o naka-reduced-motion ay nakakakita pa rin ng litrato. Nakatago ang canvas
   hangga't hindi handa ang unang mga frame; ang .is-live lang ang nagpapalit
   sa kanila. Walang paraang maging blangko ang hero. */
.portrait canvas.seq{position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;transition:opacity .5s ease;z-index:0}
.portrait img{position:relative;z-index:1;transition:opacity .5s ease}
.portrait::before{z-index:2}
.portrait::after{z-index:3}
.portrait figcaption{z-index:4}

/* --- 3D tilt: tunay na layer ng lalim ------------------------------------
   Tatlong antas ang markup dahil kailangan:

     .portrait-3d     ang may perspective
     .portrait-stage  ang tumatagilid, at may preserve-3d
     ang mga anak     may sariling translateZ

   Hindi maaaring nasa figure ang tilt. May overflow:hidden siya -- kailangan
   iyon para matabas ang litrato sa loob ng kahon -- at ang overflow maliban
   sa visible ay pinipilit ang transform-style na maging flat. Kaya ang mga
   anak ng figure ay walang sariling lalim, kahit ilagyan ng translateZ.

   Ang mga anghulo ay galing sa JS sa pamamagitan ng --tx/--ty. Walang unit
   sila at dinadagdagan ng deg dito, dahil hindi mapaparami ang deg sa px --
   at px ang kailangan ng parallax sa loob. */
.portrait-3d{perspective:1200px;perspective-origin:50% 45%}
.portrait-stage{position:relative;transform-style:preserve-3d;
  transform:rotateX(calc(var(--tx,0) * 1deg)) rotateY(calc(var(--ty,0) * 1deg));
  box-shadow:0 30px 70px -38px rgba(0,0,0,.95);
  transition:box-shadow .45s ease}

/* Ang kapal. Nakaupo siya sa likod ng litrato at kaunting lumalabas sa
   gilid, kaya pag tumagilid ay may nakikitang tabi -- iyon ang pagkakaiba ng
   slab at ng patag na larawang naka-skew. */
.portrait-edge{position:absolute;inset:0;transform:translateZ(-18px);
  background:#08090b;pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.9), 0 18px 40px -22px rgba(0,0,0,.9)}

/* Ang frame, nasa harap. Ito ang dating border ng figure. */
.portrait-frame{position:absolute;inset:0;transform:translateZ(18px);
  pointer-events:none;border:1px solid var(--line);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}

/* --- Perspective grid sa likod -------------------------------------------
   Lumalabas siya sa gilid ng litrato (inset na negatibo), kaya pag tumagilid
   ay may nakikitang sahig sa likod. Ang grid ang pinakamalakas na senyas ng
   lalim sa mata -- mas malakas pa kaysa sa tilt mismo, dahil may nakikitang
   linyang nagtatagpo.

   Naka-mask papuntang transparent sa gilid, kung hindi ay parang naka-tape
   na papel ang dulo ng grid. */
.portrait-grid{position:absolute;inset:-16%;transform:translateZ(-52px);
  pointer-events:none;opacity:.75;
  background-image:
    repeating-linear-gradient(0deg,  rgba(201,242,77,.17) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(201,242,77,.17) 0 1px, transparent 1px 34px);
  -webkit-mask-image:radial-gradient(68% 68% at 50% 45%, #000 26%, transparent 76%);
          mask-image:radial-gradient(68% 68% at 50% 45%, #000 26%, transparent 76%)}
/* Ang larawan ay gumagalaw pasalungat sa tilt -- iyon ang nagbibigay ng
   lalim. Naka-scale ng 1.06 para hindi sumipot ang gilid kapag umusog. */
.portrait canvas.seq, .portrait img{
  transform:translate3d(calc(var(--px,0) * 1px), calc(var(--py,0) * 1px), 0) scale(1.06)}
/* Sinag na sumusunod sa tilt. Nasa ::before, na dati ay walang gamit. */
.portrait::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px circle at calc(var(--gx,50) * 1%) calc(var(--gy,26) * 1%),
    rgba(201,242,77,.13), transparent 62%)}
.portrait.is-live canvas.seq{opacity:1}
.portrait.is-live img{opacity:0}
/* Habang nagpre-load: manipis na sinulid, hindi spinner. Sapat na senyas
   ang isang gumagalaw na linya at hindi humahatak ng mata palayo sa litrato. */
.portrait .seq-bar{position:absolute;left:0;top:0;height:2px;z-index:4;width:0;
  background:var(--accent);opacity:.85;transition:width .25s ease,opacity .5s ease}
.portrait.is-live .seq-bar{opacity:0}
/* Hawak ang taas habang nagpapalit ng frame. Kung wala ito, tatalon ang
   buong hero grid sa sandaling maging absolute ang <img>. */
.portrait.is-seq{aspect-ratio:var(--seq-ar,768/634)}
.portrait.is-seq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* marquee */
.marquee{margin-top:clamp(56px,7vw,88px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:16px 0}
.marquee ul{display:flex;margin:0;padding:0;list-style:none;width:max-content;animation:slide 38s linear infinite}
.marquee li{font-family:var(--mono);font-size:clamp(13px,1.5vw,16px);color:var(--muted);white-space:nowrap;padding:0 26px;border-right:1px solid var(--line)}
.marquee li:nth-child(even){color:var(--accent)}
@keyframes slide{to{transform:translateX(-50%)}}
.marquee:hover ul{animation-play-state:paused}

/* expertise */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.cards article{background:var(--bg);padding:32px 26px;transition:background .2s ease}
.cards article:hover{background:var(--surface)}
.cards .n{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;margin-bottom:18px}
.cards h3{margin-bottom:12px}
.cards p{color:var(--muted);font-size:15.5px;margin:0}
@media(max-width:860px){.cards{grid-template-columns:1fr}}

/* work */
.filters{display:flex;flex-wrap:wrap;gap:8px 20px;margin:34px 0 10px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.filters span:first-child{color:var(--text)}
.project{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,4vw,56px);background:var(--surface);border:1px solid var(--line);padding:clamp(26px,3.4vw,42px);margin-top:22px}
@media(max-width:900px){.project{grid-template-columns:1fr}}
.project .meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:16px}
.project h3{margin-bottom:16px;max-width:24ch}
.project p{color:var(--muted);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tags span{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:5px 10px}
.metrics{align-self:start;border-top:1px solid var(--line)}
.metrics .m{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line)}
.metrics .k{font-size:14px;color:var(--muted)}
.metrics .b{font-family:var(--mono);font-size:14px;color:var(--flag);text-decoration:line-through;text-decoration-thickness:1px}
.metrics .a{font-family:var(--mono);font-size:16px;color:var(--sync);font-weight:500}
.metrics .cap{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:12px;display:block}
.project.todo{background:transparent;border-style:dashed}
.project.todo .meta{color:var(--flag)}
.project.todo em{color:var(--muted)}

/* experience */
.exp{border-top:1px solid var(--line);margin-top:44px}
.job{display:grid;grid-template-columns:200px 1fr;gap:8px 40px;padding:30px 0;border-bottom:1px solid var(--line)}
.job .when{font-family:var(--mono);font-size:13px;color:var(--accent)}
.job h4{margin-bottom:10px}
.job p{color:var(--muted);font-size:16px;margin:0}
.job .tags{margin-top:16px}
@media(max-width:760px){.job{grid-template-columns:1fr;gap:6px}}

/* quote */
.quote{background:var(--surface);border:1px solid var(--line);padding:clamp(28px,4vw,48px);margin-top:44px}
.quote p{font-size:clamp(18px,2.2vw,24px);line-height:1.45;letter-spacing:-.015em;margin-bottom:20px;max-width:34ch}
.quote cite{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--muted)}

/* contact */
.contact h2{max-width:16ch;margin-bottom:22px}
.contact .avail{font-family:var(--mono);font-size:13px;color:var(--accent);margin-bottom:24px;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,242,77,.55)}70%{box-shadow:0 0 0 9px rgba(201,242,77,0)}100%{box-shadow:0 0 0 0 rgba(201,242,77,0)}}
.socials{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:32px;font-family:var(--mono);font-size:14px}
.socials a{color:var(--muted);text-decoration:none}
.socials a:hover{color:var(--accent)}

footer{padding:32px 0 48px;border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.svc article{background:var(--bg);padding:28px 24px;transition:background .2s ease}
.svc article:hover{background:var(--surface)}
.svc h4{margin-bottom:10px}
.svc p{color:var(--muted);font-size:15px;margin:0}
@media(max-width:860px){.svc{grid-template-columns:1fr}}

/* industries */
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}
.pills span{font-family:var(--mono);font-size:13px;color:var(--muted);border:1px solid var(--line);padding:9px 15px;transition:border-color .18s ease,color .18s ease}
.pills span:hover{border-color:var(--accent);color:var(--accent)}

/* portfolio grid */
.pf{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:44px}
.pf article{background:var(--surface);border:1px solid var(--line);padding:28px 26px;display:flex;flex-direction:column;gap:14px;transition:border-color .18s ease}
.pf article:hover{border-color:var(--accent)}
.pf .n{font-family:var(--mono);font-size:12px;color:var(--accent)}
.pf h3{font-size:21px}
.pf p{color:var(--muted);font-size:15px;margin:0}
.pf .tags{margin-top:auto}
.pf h3 a{color:inherit;text-decoration:none}
.pf h3 a:hover{color:var(--accent)}
.pf .pfgo{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;margin-top:2px}
.pf .pfgo:hover{text-decoration:underline}
.pf .pfgos{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:2px}
.pf .pfgos .pfgo{margin-top:0}
@media(max-width:860px){.pf{grid-template-columns:1fr}}

/* automation framework */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:44px}
.flow .step{background:var(--bg);padding:28px 20px;position:relative;transition:background .2s ease}
.flow .step:hover{background:var(--surface)}
.flow .step .n{font-family:var(--mono);font-size:12px;color:var(--accent);display:block;margin-bottom:16px}
.flow .step h4{margin-bottom:10px}
.flow .step p{color:var(--muted);font-size:14px;margin:0}
.flow .step:not(:last-child)::after{content:"\2192";position:absolute;right:-10px;top:24px;z-index:2;color:var(--accent);font-family:var(--mono);font-size:15px;background:var(--bg);width:18px;text-align:center}
@media(max-width:860px){
  .flow{grid-template-columns:1fr}
  .flow .step:not(:last-child)::after{content:"\2193";right:20px;top:auto;bottom:-10px;height:18px}
}

/* kung may mali sa content.js */
.boot{max-width:640px;margin:14vh auto;padding:0 24px;font-family:var(--mono);font-size:14px;color:var(--flag);line-height:1.8}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div id="app"></div>

<!-- LAMAN NG SITE. I-edit ang content.js, hindi ang file na ito. -->
<script src="content.js"></script>

<script>
(function(){
  var S = window.SITE;
  var app = document.getElementById('app');

  if(!S){
    app.innerHTML = '<div class="boot">Hindi na-load ang content.js.<br><br>'+
      'Tiyakin na magkasama sa iisang folder ang index.html, content.js, at ang larawan — '+
      'at na walang typo (nawawalang kuwit o quote) sa content.js. '+
      'Buksan ang Console (F12) para makita ang eksaktong linya.</div>';
    return;
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s); }
  function has(v){ return v != null && String(v).trim() !== ''; }
  function list(a){ return Array.isArray(a) ? a : []; }

  function ext(h){ return /^https?:/i.test(String(h)) ? ' target="_blank" rel="noopener"' : ''; }
  function btns(arr){
    return '<div class="btnrow">' + list(arr).map(function(b){
      return '<a class="btn'+(b.style === 'ghost' ? ' ghost' : '')+'" href="'+esc(b.href)+'"'+ext(b.href)+'>'+esc(b.label)+'</a>';
    }).join('') + '</div>';
  }
  function tags(arr){
    if(!list(arr).length) return '';
    return '<div class="tags">' + arr.map(function(t){ return '<span>'+esc(t)+'</span>'; }).join('') + '</div>';
  }
  function labelOf(x){ return has(x && x.label) ? '<p class="label">'+esc(x.label)+'</p>' : ''; }

  /* ---------- theme ---------- */
  if(S.theme){
    for(var k in S.theme){ document.documentElement.style.setProperty(k, S.theme[k]); }
  }
  if(S.meta){
    if(has(S.meta.title)) document.title = S.meta.title;
    var md = document.querySelector('meta[name="description"]');
    if(md && has(S.meta.description)) md.setAttribute('content', S.meta.description);
  }

  var out = [];

  /* ---------- header ---------- */
  out.push(
    '<header class="masthead"><div class="wrap">'+
      '<a class="mark" href="#top">'+esc(S.brand)+'</a>'+
      '<nav>'+ list(S.nav).map(function(n){
        return '<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>';
      }).join('') +'</nav>'+
    '</div></header>'
  );

  /* ---------- hero ---------- */
  var h = S.hero || {};
  // Ang canvas at ang preload bar ay laging nailalabas, pero patay sila hangga't
  // hindi nakakahanap ng frames ang engine sa ibaba. Kaya ang markup ay pareho
  // ang itsura sa bisitang walang JS at sa ngayon na wala pang frames.
  // Tatlong antas: ang .portrait-3d ang may perspective, ang .portrait-stage
  // ang tumatagilid at may preserve-3d, at ang mga anak niya ang may sariling
  // Z. Hindi maaaring nasa figure ang tilt: may overflow:hidden siya, at ang
  // overflow maliban sa visible ay pinipilit ang transform-style na maging
  // flat -- kaya ang mga anak ay hindi magkakaroon ng lalim.
  //
  // Ang grid ay nasa likod, ang gilid (kapal) ay nasa likod din, at ang frame
  // ay nasa harap -- kaya pag tumagilid, dumadaan ang gilid ng frame sa
  // ibabaw ng litrato, gaya ng tunay na bintana.
  var photo = has(h.photo)
    ? '<div class="portrait-3d">'+
      '<div class="portrait-stage">'+
      '<div class="portrait-grid" aria-hidden="true"></div>'+
      '<div class="portrait-edge" aria-hidden="true"></div>'+
      '<figure class="portrait">'+
      '<canvas class="seq" aria-hidden="true"></canvas>'+
      '<span class="seq-bar" aria-hidden="true"></span>'+
      '<img src="'+esc(h.photo)+'" alt="'+esc(h.photoAlt || h.name)+'">'+
      ((has(h.photoLeft) || has(h.photoRight))
        ? '<figcaption><span>'+esc(h.photoLeft)+'</span><b>'+esc(h.photoRight)+'</b></figcaption>' : '')+
      '</figure>'+
      '<div class="portrait-frame" aria-hidden="true"></div>'+
      '</div></div>'
    : '';

  var marquee = list(S.marquee).length
    ? '<div class="marquee" aria-hidden="true"><ul>'+
        list(S.marquee).concat(list(S.marquee)).map(function(m){ return '<li>'+esc(m)+'</li>'; }).join('')+
      '</ul></div>'
    : '';

  out.push(
    '<section id="top" class="hero">'+
      '<div class="wrap hero-grid"><div>'+
        '<h1>'+esc(h.name)+'</h1>'+
        (has(h.role) ? '<p class="role">'+esc(h.role)+'</p>' : '')+
        (has(h.lede) ? '<p class="lede">'+esc(h.lede)+'</p>' : '')+
        btns(h.buttons)+
      '</div>'+ photo +'</div>'+
      marquee+
    '</section>'
  );

  /* ---------- expertise ---------- */
  if(S.expertise){
    var e = S.expertise;
    out.push(
      '<section id="expertise"><div class="wrap">'+
        labelOf(e)+
        (has(e.heading) ? '<h2>'+esc(e.heading)+'</h2>' : '')+
        (has(e.lede) ? '<p class="lede" style="margin-top:20px">'+esc(e.lede)+'</p>' : '')+
        '<div class="cards">'+ list(e.items).map(function(it, i){
          return '<article><span class="n">'+('0'+(i+1)).slice(-2)+'</span>'+
                 '<h3>'+esc(it.title)+'</h3><p>'+esc(it.text)+'</p></article>';

    );

  /* ---------- services ---------- */
  if(S.services){
    var sv = S.services;
    out.push(
      '<section id="services"><div class="wrap">'+
        labelOf(sv)+
        (has(sv.heading) ? '<h2>'+esc(sv.heading)+'</h2>' : '')+

        '<div class="svc">'+ list(sv.items).map(function(it){
          return '<article><h4>'+esc(it.title)+'</h4><p>'+esc(it.text)+'</p></article>';
        }).join('') +'</div>'+

    );

  /* ---------- automation framework ---------- */
  if(S.framework){
    var fw = S.framework;
    out.push(
      '<section id="framework"><div class="wrap">'+
        labelOf(fw)+
        (has(fw.heading) ? '<h2>'+esc(fw.heading)+'</h2>' : '')+
        (has(fw.lede) ? '<p class="lede" style="margin-top:20px">'+esc(fw.lede)+'</p>' : '')+
        '<div class="flow">'+ list(fw.steps).map(function(s, i){
          return '<div class="step"><span class="n">'+('0'+(i+1)).slice(-2)+'</span>'+
                 '<h4>'+esc(s.title)+'</h4><p>'+esc(s.text)+'</p></div>';
        }).join('') +'</div>'+
      '</div></section>'
    );
  }

  /* ---------- industries ---------- */
  if(S.industries){
    var ind = S.industries;
    out.push(
      '<section id="industries"><div class="wrap">'+
        labelOf(ind)+
        (has(ind.heading) ? '<h2>'+esc(ind.heading)+'</h2>' : '')+
        (has(ind.lede) ? '<p class="lede" style="margin-top:20px">'+esc(ind.lede)+'</p>' : '')+
        '<div class="pills">'+ list(ind.items).map(function(t){
          return '<span>'+esc(t)+'</span>';
        }).join('') +'</div>'+
      '</div></section>'
    );
  }

  /* ---------- work ---------- */
  if(S.work){
    var w = S.work;
    var cases = list(w.cases).map(function(c){
      var metrics = list(c.metrics).map(function(m){
        return '<div class="m"><span class="k">'+esc(m.k)+'</span>'+
               '<span class="b">'+esc(m.before)+'</span>'+
               '<span class="a">'+esc(m.after)+'</span></div>';
      }).join('');
      if(has(c.caption)) metrics += '<span class="cap">'+esc(c.caption)+'</span>';

      return '<article class="project'+(c.draft ? ' todo' : '')+'">'+
        '<div>'+
          '<p class="meta">'+(c.draft ? 'Draft — not published yet' : esc(c.meta))+'</p>'+
          '<h3>'+esc(c.title)+'</h3>'+
          list(c.body).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')+
          tags(c.tags)+
        '</div>'+
        (metrics ? '<div class="metrics">'+metrics+'</div>' : '')+
      '</article>';
    }).join('');

    out.push(
      '<section id="work"><div class="wrap">'+
        labelOf(w)+
        (has(w.heading) ? '<h2>'+esc(w.heading)+'</h2>' : '')+
        (has(w.lede) ? '<p class="lede" style="margin-top:20px">'+esc(w.lede)+'</p>' : '')+
        (list(w.filters).length
          ? '<div class="filters"><span>Filter by</span>'+
            w.filters.map(function(f){ return '<span>/ '+esc(f)+'</span>'; }).join('')+'</div>'
          : '')+
        cases+
      '</div></section>'
    );
  }

  /* ---------- portfolio ---------- */
  if(S.portfolio){
    var pf = S.portfolio;
    out.push(
      '<section id="portfolio"><div class="wrap">'+
        labelOf(pf)+
        (has(pf.heading) ? '<h2>'+esc(pf.heading)+'</h2>' : '')+
        (has(pf.lede) ? '<p class="lede" style="margin-top:20px">'+esc(pf.lede)+'</p>' : '')+
        '<div class="pf">'+ list(pf.items).map(function(it, i){
          /* isa o marami: href/linkLabel para sa iisang link, links[] kung marami */
          var lx = list(it.links).filter(function(l){ return l && l.href; });
          if(!lx.length && it.href) lx = [{href:it.href, label:it.linkLabel}];
          var ttl = lx.length
            ? '<a href="'+esc(lx[0].href)+'"'+ext(lx[0].href)+'>'+esc(it.title)+'</a>'
            : esc(it.title);
          var links = lx.map(function(l){
            return '<a class="pfgo" href="'+esc(l.href)+'"'+ext(l.href)+'>'+
                   esc(l.label || String(l.href).replace(/^https?:\/\//,''))+' ↗</a>';
          }).join('');
          var go = !links ? ''
            : (lx.length > 1 ? '<div class="pfgos">'+links+'</div>' : links);
          return '<article><span class="n">'+('0'+(i+1)).slice(-2)+' / '+esc(it.kind || 'System')+'</span>'+
                 '<h3>'+ttl+'</h3><p>'+esc(it.text)+'</p>'+tags(it.tags)+go+'</article>';
        }).join('') +'</div>'+
      '</div></section>'
    );
  }

  /* ---------- experience ---------- */
  if(S.experience){
    var x = S.experience;
    out.push(
      '<section id="experience"><div class="wrap">'+
        labelOf(x)+
        (has(x.heading) ? '<h2>'+esc(x.heading)+'</h2>' : '')+
        '<div class="exp">'+ list(x.jobs).map(function(j){
          return '<article class="job"><span class="when">'+esc(j.when)+'</span>'+
                 '<div><h4>'+esc(j.title)+'</h4><p>'+esc(j.text)+'</p>'+tags(j.tags)+'</div></article>';
        }).join('') +'</div>'+

  /* ---------- quote ---------- */
  if(S.quote && has(S.quote.text)){
    out.push(

      '</div></section>'

  }

  /* ---------- trainings ---------- */
  if(S.trainings){
    var tr = S.trainings;
    out.push(
      '<section id="trainings"><div class="wrap">'+
        labelOf(tr)+
        (has(tr.heading) ? '<h2>'+esc(tr.heading)+'</h2>' : '')+
        (has(tr.lede) ? '<p class="lede" style="margin-top:20px">'+esc(tr.lede)+'</p>' : '')+
        '<div class="exp train">'+ list(tr.items).map(function(t){
          return '<article class="job"><span class="when">'+esc(t.format)+'</span>'+
                 '<div><h4>'+esc(t.title)+'</h4><p>'+esc(t.text)+'</p>'+tags(t.tags)+'</div></article>';
        }).join('') +'</div>'+
      '</div></section>'
    );
  }

  /* ---------- contact ---------- */
  if(S.contact){
    var c2 = S.contact;
    out.push(
      '<section id="contact" class="contact"><div class="wrap">'+
        labelOf(c2)+
        (has(c2.availability) ? '<p class="avail"><span class="dot"></span>'+esc(c2.availability)+'</p>' : '')+
        (has(c2.heading) ? '<h2>'+esc(c2.heading)+'</h2>' : '')+
        (has(c2.lede) ? '<p class="lede">'+esc(c2.lede)+'</p>' : '')+
        '<div style="margin-top:30px">'+btns(c2.buttons)+'</div>'+
        (list(c2.links).length
          ? '<div class="socials">'+c2.links.map(function(l){
              return '<a href="'+esc(l.href)+'"'+ext(l.href)+'>'+esc(l.label)+'</a>';
            }).join('')+'</div>'
          : '')+
      '</div></section>'
    );
  }

  /* ---------- footer ---------- */
  if(S.footer){
    out.push('<footer><div class="wrap"><span>'+esc(S.footer.left)+'</span><span>'+esc(S.footer.right)+'</span></div></footer>');
  }

  app.innerHTML = out.join('');
})();
</script>

<script>
/* ============================================================
   PORTRAIT SEQUENCE — scroll-driven frame animation.

   Ang lalim ay galing sa mga naka-render nang frame, hindi sa CSS 3D: isang
   sunod-sunod na larawan na ginuguhit sa <canvas>, at ang scroll position ang
   pumipili kung aling frame. Ito ang teknik ng mga product page ng Apple, at
   ito rin ang nasa reference video.

   PAANO ITO BUHAYIN — dalawang bagay lang:
     1. Gumawa ng folder na `frames/` sa tabi ng index.html.
     2. Ilagay doon ang sunod-sunod na larawan, naka-numero mula 1:
            frames/hero-0001.jpg, hero-0002.jpg, ... hero-0120.jpg

   Walang bilang na kailangang i-edit: hinahanap mismo ng engine kung ilan ang
   frame mo. Doble-doble muna ang hula (1, 2, 4, 8...) hanggang mapalo sa wala,
   saka hinahati ang pagitan -- mga labing-apat na request para sa isang daang
   frame, hindi isang daan.

   Hangga't wala ang frames, tumitigil ang engine at ang static na litrato ang
   nananatili -- hindi nasisira ang site. Sinusubok muna nito ang unang frame
   bago mag-preload ng kahit ano.
   ============================================================ */
(function(){
  'use strict';

  var SEQ = {
    dir:   'frames/',
    base:  'hero-',
    ext:   '.jpg',
    pad:   4,        // hero-0001.jpg
    count: 0,        // 0 = hanapin mismo; itakda lang kung ayaw ng pagtuklas
    max:   600,      // hangganan ng paghahanap, para hindi walang katapusan
    // Gaano karaming scroll ang kumakain sa buong sequence, bilang bahagi ng
    // taas ng viewport. 1.4 = tapos na ang huling frame bago pa tuluyang
    // umalis ang hero sa screen.
    span:  1.4
  };

  var fig = document.querySelector('.portrait');
  if (!fig) return;
  var cv = fig.querySelector('canvas.seq');
  var bar = fig.querySelector('.seq-bar');

  // Dalawang magkaibang tungkulin, kaya dalawang elemento:
  //   fig  -- ang figure. Dito ang is-seq/is-live at ang --seq-ar, at ang
  //           rect niya ang sinusukat ng sequence.
  //   host -- ang .portrait-3d. Dito isinusulat ang tilt vars, dahil
  //           namamana sila pababa sa stage, grid, edge at frame; at dito
  //           din ang pointer, para pumasok na sa loob ang grid na lumalabas
  //           sa gilid.
  // Kapag walang .portrait-3d (lumang markup), bumabagsak sa figure -- hindi
  // sasabog, kulang lang ang lalim.
  var host = document.querySelector('.portrait-3d') || fig;

  // Ang bisitang humihingi ng tahimik na interface ay hindi natin bibigyan ng
  // animation na hinihila ng scroll -- iyon ang klaseng galaw na pinapatay ng
  // setting na ito. Nananatili ang litrato, walang tilt, at hindi tayo
  // nagdo-download ng isang daang larawan para sa wala.
  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm) return;

  /* ====================================================================
     ISANG SCHEDULER PARA SA DALAWA

     Dalawang bagay ang gumagalaw sa portrait: ang tilt (laging nandiyan) at
     ang frame sequence (kapag may frames). Iisang rAF ang naghahatid sa
     dalawa -- dalawang magkahiwalay na loop ay dalawang beses na trabaho
     kada scroll para sa isang elemento.

     Ang `pending` ang sumasagot sa "may naka-schedule na ba", at ang `raf` ay
     hawak lang para makansela. Hindi pinagsama: hindi tumatakbo ang rAF sa
     nakatagong tab, at kung ang handle mismo ang bantay, maiiwan siyang
     nakataas nang tuluyan -- mag-scroll, magpalit ng tab, bumalik, at patay
     na ang lahat dahil hindi na makakapag-schedule muli.
     ================================================================= */
  var raf = 0, pending = false, visible = true;
  var tasks = [];      // tumatakbo kada rAF
  var measures = [];   // tumatakbo kapag nagbago ang sukat ng viewport

  function schedule(){
    if (pending) return;
    pending = true;
    raf = requestAnimationFrame(function(){ pending = false; raf = 0; runTasks(); });
  }
  function runTasks(){
    if (!visible) return;
    for (var i = 0; i < tasks.length; i++) tasks[i]();
  }
  function remeasure(){
    for (var i = 0; i < measures.length; i++) measures[i]();
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', function(){ remeasure(); runTasks(); });

  document.addEventListener('visibilitychange', function(){
    // Linisin sa dalawang direksyon. Ang naka-schedule na rAF bago magtago ay
    // hindi na kailanman tatakbo, kaya basura na ang handle at mali na ang
    // `pending`.
    if (raf) cancelAnimationFrame(raf);
    raf = 0; pending = false;
    if (!document.hidden) schedule();
  });

  // Kapag wala na sa screen ang hero, tumitigil ang lahat. Walang saysay ang
  // mag-render ng bagay na walang nakakakita.
  if (window.IntersectionObserver) {
    new IntersectionObserver(function(en){
      visible = en[0].isIntersecting;
      if (visible) schedule();
    }, { rootMargin: '120px' }).observe(host);
  }

  /* ====================================================================
     3D TILT — ito ang gumagalaw kahit walang frames.

     Ang buong card ang tumatagilid sa 3D, at ang larawan sa loob ay umuusog
     nang pasalungat. Iyon ang nagbibigay ng lalim: kung parehong direksyon
     sila, flat na larawang nakatagilid lang ang makikita.

     Hindi translateZ ang ginamit sa loob dahil may `overflow:hidden` ang
     figure, at ang overflow maliban sa visible ay pinipilit ang
     transform-style na maging flat -- kaya hindi maaaring magkaroon ng
     sariling Z ang mga anak. 2D na usog ang katumbas at pareho ang dating.
     ================================================================= */
  (function initTilt(){
    var tx = 0, ty = 0, gx = 50, gy = 26;          // kasalukuyan
    var TX = 0, TY = 0, GX = 50, GY = 26;          // hinahabol
    var hover = false, top = 0, hgt = 1;

    function tiltMeasure(){
      var r = host.getBoundingClientRect();
      top = r.top + window.pageYOffset;
      hgt = r.height || 1;
    }

    // Habang gumugulong: sumasandal paatras ang itaas pagpasok, pasulong
    // paglabas. Isang mabagal na pagtango sa buong pagdaan ng hero.
    function scrollTilt(){
      var vh = window.innerHeight || 1;
      var rel = top - window.pageYOffset;
      var p = 1 - (rel + hgt) / (vh + hgt);
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      return (0.5 - p) * 10;
    }

    if (window.PointerEvent) {
      host.addEventListener('pointermove', function(e){
        var r = host.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var nx = (e.clientX - r.left) / r.width  - 0.5;   // -0.5 .. 0.5
        var ny = (e.clientY - r.top)  / r.height - 0.5;
        hover = true;
        TY = nx * 14;
        TX = -ny * 10;      // baliktad: pababa ang cursor, sumasandal paatras
        GX = 50 + nx * 90;
        GY = 26 + ny * 60;
        schedule();
      }, { passive: true });
      host.addEventListener('pointerleave', function(){
        hover = false;
        schedule();
      }, { passive: true });
    }

    function tiltFrame(){
      if (!hover) { TX = scrollTilt(); TY = 0; GX = 50; GY = 26; }
      // Hinahabol, hindi itinatakda: kung deretsong isasalin ang target ay
      // tatalon ang card sa sandaling umalis ang cursor.
      tx += (TX - tx) * 0.12;  ty += (TY - ty) * 0.12;
      gx += (GX - gx) * 0.12;  gy += (GY - gy) * 0.12;
      var s = host.style;
      s.setProperty('--tx', tx.toFixed(2));
      s.setProperty('--ty', ty.toFixed(2));
      s.setProperty('--px', (-ty * 1.1).toFixed(2));
      s.setProperty('--py', ( tx * 1.1).toFixed(2));
      s.setProperty('--gx', gx.toFixed(1));
      s.setProperty('--gy', gy.toFixed(1));
      // Magpatuloy hangga't hindi pa lumapag. Tumitigil kapag lumapag na --
      // walang rAF na tumatakbo nang walang ginagawa.
      if (Math.abs(TX - tx) > 0.02 || Math.abs(TY - ty) > 0.02) schedule();
    }

    measures.push(tiltMeasure);
    tasks.push(tiltFrame);
    tiltMeasure();
    tiltFrame();
  })();

  // Ang frame sequence ay nangangailangan ng canvas; ang tilt ay hindi.
  if (!cv) return;

  // Sa mahinang koneksyon o naka-Data Saver, isa sa bawat dalawang frame lang
  // ang kinukuha. Mas magaspang ang galaw pero kalahati ang bigat -- mas mabuti
  // iyon kaysa sa hero na hindi kailanman natatapos mag-load sa mobile data.
  var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  var thin = !!(conn && (conn.saveData || /^([23]g|slow-2g)$/.test(conn.effectiveType || '')));
  var stride = (thin || window.innerWidth < 700) ? 2 : 1;

  function url(n){
    var s = String(n);
    while (s.length < SEQ.pad) s = '0' + s;
    return SEQ.dir + SEQ.base + s + SEQ.ext;
  }

  /* --- Meron ba talagang frames? ---------------------------------------
     Isang larawan lang ang sinusubok. Kapag 404, tumahimik tayo: walang
     malakas na error sa console ng bisita, walang nabagong itsura. */
  var probe = new Image();
  probe.onerror = function(){ /* wala pang frames -- static na litrato ang mananatili */ };
  probe.onload  = function(){
    if (SEQ.count > 0) { start(probe, SEQ.count); return; }
    countFrames(function(n){ start(probe, n); });
  };
  probe.src = url(1);

  /** Meron ba ang frame n? */
  function exists(n, cb){
    var im = new Image();
    im.onload  = function(){ cb(true); };
    im.onerror = function(){ cb(false); };
    im.src = url(n);
  }

  /* Hinahanap ang huling frame na meron. Alam nating meron ang 1, kaya
     doble-doble ang hula hanggang mapalo sa wala, saka binary search sa
     pagitan ng huling meron at unang wala. */
  function countFrames(done){
    var lo = 1, hi = 0, p = 2;

    function up(){
      if (p > SEQ.max) { hi = SEQ.max + 1; bin(); return; }
      exists(p, function(ok){
        if (ok) { lo = p; p *= 2; up(); }
        else    { hi = p; bin(); }
      });
    }
    function bin(){
      if (hi - lo <= 1) { done(lo); return; }
      var mid = (lo + hi) >> 1;
      exists(mid, function(ok){
        if (ok) lo = mid; else hi = mid;
        bin();
      });
    }
    up();
  }

  function start(first, count){
    // Ang tunay na proporsyon ng frame ang nagtatakda ng taas ng kahon, hindi
    // ang hula. Kung mas mataas ang frames kaysa sa litrato, susunod ang kahon
    // at hindi mapipilipit ang larawan.
    if (first.naturalWidth && first.naturalHeight) {
      fig.style.setProperty('--seq-ar', first.naturalWidth + '/' + first.naturalHeight);
    }
    fig.classList.add('is-seq');

    var idx = [];
    for (var n = 1; n <= count; n += stride) idx.push(n);
    // Isang frame lang na naka-stride ay walang animation -- bumalik sa lahat.
    if (idx.length < 2 && count > 1) { idx = []; for (n = 1; n <= count; n++) idx.push(n); }
    var imgs = new Array(idx.length);
    imgs[0] = first;

    var ctx = cv.getContext('2d', { alpha: false });
    var loaded = 1, live = false, cur = -1, raf = 0, pending = false, visible = true;

    /* --- Sukat ng canvas ------------------------------------------------
       Sinusukat sa device pixels para hindi malabo sa retina, at may hangganang
       2 para hindi tayo gumuhit ng 4x na pixel sa telepono nang walang
       nadadagdag na nakikita. */
    function resize(){
      var r = cv.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.round(r.width * dpr), hh = Math.round(r.height * dpr);
      if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; cur = -1; }
    }

    /* --- Isang frame, naka-cover fit ------------------------------------
       Hindi 'stretch': pinapanatili ang proporsyon at tinatabas ang labis,
       gaya ng object-fit:cover. Ang pagpilipit sa mukha ay mas masahol pa sa
       pagkawala ng gilid. */
    function draw(i){
      var im = imgs[i];
      if (!im || !im.complete || !im.naturalWidth) return false;
      var cw = cv.width, ch = cv.height;
      var s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
      var dw = im.naturalWidth * s, dh = im.naturalHeight * s;
      ctx.drawImage(im, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
      cur = i;
      return true;
    }

    /* --- Scroll -> frame -----------------------------------------------
       Frame 0 sa itaas ng pahina, huling frame kapag naiakyat na ang hero.
       Sinusukat sa document coordinates, hindi sa getBoundingClientRect kada
       scroll -- iisang read lang kada resize kaysa kada frame. */
    var endY = 1;
    function measure(){
      resize();
      var r = fig.getBoundingClientRect();
      var top = r.top + window.pageYOffset;
      endY = Math.max(1, top + r.height + window.innerHeight * (SEQ.span - 1));
    }

    function pick(){
      var p = Math.min(1, Math.max(0, window.pageYOffset / endY));
      // Hindi lumalampas sa naipasok pa lang na frame: sa unang mga segundo,
      // mabilis pang mag-scroll ang tao kaysa sa download.
      var last = Math.max(0, loaded - 1);
      return Math.min(last, Math.round(p * (idx.length - 1)));
    }

    // Hindi na siya nagtatanong ng `visible`: ang runTasks ang bantay niyon
    // para sa lahat ng task.
    function frame(){
      var i = pick();
      if (i !== cur) draw(i);
    }

    /* --- Preload --------------------------------------------------------
       Anim na sabay, sunod-sunod mula sa umpisa. Hindi lahat-sabay: isang
       daang parallel na request ay pinipigilan ng browser at pinapabagal ang
       lahat, kasama ang unang frame na kailangan agad. */
    var next = 1, inflight = 0;
    function pump(){
      while (inflight < 6 && next < idx.length) {
        (function(k){
          inflight++;
          var im = new Image();
          im.onload = im.onerror = function(){
            inflight--;
            // Ang bilang ng frame na kayang iguhit ay ang haba ng tuloy-tuloy
            // na naunang bahagi -- kaya hindi tumatalon ang animation sa butas.
            if (im.naturalWidth) imgs[k] = im;
            while (loaded < idx.length && imgs[loaded] && imgs[loaded].naturalWidth) loaded++;
            if (!live && loaded >= Math.min(10, idx.length)) {
              live = true;
              fig.classList.add('is-live');
              measure();
              draw(pick());
            }
            if (bar) bar.style.width = Math.round(loaded / idx.length * 100) + '%';
            pump();
          };
          im.src = url(idx[k]);
        })(next++);
      }
    }

    // Ipakita agad ang unang frame kahit isa lang ang meron, para hindi
    // maghintay ang mata sa buong sequence bago may mangyari.
    measure();
    if (idx.length === 1) { live = true; fig.classList.add('is-live'); draw(0); }
    pump();

    // Sumasakay na lang siya sa scheduler na naka-bukas na sa itaas -- walang
    // sariling scroll listener, walang sariling rAF, walang pangalawang
    // IntersectionObserver sa parehong elemento.
    measures.push(measure);
    tasks.push(frame);
  }
})();
</script>
